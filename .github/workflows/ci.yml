name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: barberapp_test
          POSTGRES_USER: barberuser
          POSTGRES_PASSWORD: barberpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U barberuser -d barberapp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://barberuser:barberpass@localhost:5432/barberapp_test
      JWT_SECRET_KEY: ci-secret-key-not-used-outside-continuous-integration
      SHOP_TIMEZONE: America/Argentina/Buenos_Aires
      DEMO_ENABLED: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install "ruff>=0.6"

      - name: Lint
        run: ruff check backend

      - name: Byte-compile
        run: python -m compileall -q backend

      - name: Apply migrations against PostgreSQL
        run: python -m alembic upgrade head

      - name: Check migrations match the models
        run: python -m alembic check

      - name: Tests
        run: python -m pytest backend/tests

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config --quiet
