# Applied automatically by `docker compose up`. Swaps both services to
# their development mode with hot reload and bind-mounted sources.
services:
  backend:
    command:
      [
        "sh",
        "-c",
        "cd /app && alembic -c /app/alembic.ini upgrade head && cd /app/backend && uvicorn main:app --host 0.0.0.0 --port 8000 --reload",
      ]
    volumes:
      - ./backend:/app/backend
      - ./alembic.ini:/app/alembic.ini

  frontend:
    build:
      target: dev
    command: npm run dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:
